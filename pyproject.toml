[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "doc2md-tool"
version = "0.1.0"
description = "拖拽文件批量转 Markdown 的桌面工具（基于 markitdown + 内置 OCR），为 RAG 流水线优化"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "markitdown[pdf,docx,pptx,xlsx]==0.1.7",
]

[project.optional-dependencies]
gui = ["PySide6>=6.6,<7"]
ocr = [
    "rapidocr_onnxruntime>=1.3,<2",
    "pypdfium2>=4.30",
    "Pillow>=10.0",
    "opencv-python-headless==4.10.0.84",
    "numpy>=1.24,<2",
]
all-extras = []

[project.scripts]
doc2md = "doc2md_tool._cli:main"
doc2md-gui = "doc2md_tool.gui:run_gui"

[tool.hatch.build.targets.wheel]
packages = ["src/doc2md_tool"]
