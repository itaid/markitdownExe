name: build

on:
  push:
    branches: [main]
    tags: ["v*"]          # 打 tag（如 v0.2.0）→ 构建发布版
  workflow_dispatch:
    inputs:
      tag:
        description: "手动指定版本号（留空=latest）"
        required: false
        default: ""

# 版本号优先级: 触发 tag > 手动输入 > latest
env:
  VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name
               || github.event.inputs.tag
               || 'latest' }}

jobs:
  test:
    name: 转换核心测试 (ubuntu)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: |
          python -m pip install -e ".[gui,ocr]" pytest
          pytest -q

  build-windows:
    name: 打包 Windows EXE
    runs-on: windows-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 写入版本号
        shell: pwsh
        run: |
          $ver = "${{ env.VERSION }}".TrimStart('v')
          Add-Content -Path "src/doc2md_tool/__init__.py" -Value ""
          (Get-Content "src/doc2md_tool/__init__.py") -replace '__version__ = "[^"]*"','__version__ = "' + $ver + '"') | Set-Content "src/doc2md_tool/__init__.py"
          Write-Output "构建版本: v$ver"
      - name: 安装依赖
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[gui,ocr]" pyinstaller
      - name: 打包
        shell: pwsh
        run: pyinstaller pack/doc2md.spec --noconfirm
      - name: 压缩成品
        shell: pwsh
        run: |
          Compress-Archive -Path dist/doc2md -DestinationPath "dist/doc2md_${{ env.VERSION }}_win64.zip"
      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: doc2md_${{ env.VERSION }}_win64
          path: dist/doc2md_${{ env.VERSION }}_win64.zip
          if-no-files-found: error
          retention-days: 90
